required_version = ">=0.36.0"

[discovery]
exclude = ["/.ai-rulez/.generated-manifest.json", "/.mcp.json"]

[hooks]
stages = ["pre-commit"]

[hooks.builtin]
# Formula/*.rb are Homebrew formulas: they follow Homebrew DSL idiom (`url "..."`
# without parens, EOS heredocs, etc.) and are audited by `brew style`, not poly's
# generic rubocop. Exclude them so the hooks don't rewrite them into non-idiomatic
# Ruby that `brew audit` would then reject.
lint = { exclude = ["**/*.lock", "Formula/**", "/.ai-rulez/.generated-manifest.json", "/.mcp.json"] }
fmt = { exclude = ["**/*.lock", "Formula/**", "/.ai-rulez/.generated-manifest.json", "/.mcp.json"] }
commit = { stages = ["commit-msg"] }
file_safety = { exclude = ["**/*.lock", "/.ai-rulez/.generated-manifest.json", "/.mcp.json"] }

# --- catalog tools (standalone binaries, PATH-probed) ---
[tools.rubocop]
enabled = true

[tools.shfmt]
enabled = true

[tools.shellcheck]
enabled = true

[tools.actionlint]
enabled = true

[[hooks.sources]]
id = "ai-rulez"
git = "https://github.com/Goldziher/ai-rulez.git"
revision = "v5"
hooks = ["ai-rulez-validate"]

[engines.typos]
# typos is opt-in in poly v2; this keeps the v1 default (on).
enabled = true

[engines.harper]
enabled = true
# Off: rules that contradict the org's sentence-case headings and no-Oxford-comma style, or misread technical prose
# (denylist, MB, stdin). ~keep
ignore = [
  "UseTitleCase",
  "OxfordComma",
  "SplitWords",
  "OrthographicConsistency",
  "ExpandMemoryShorthands",
  "ExpandStandardInputAndOutput",
  "ExpandConfiguration",
  "ExpandMinimum",
]
