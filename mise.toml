# Versions follow the xberg-io/toolchains baseline named in toolchains.toml. ~keep
[settings]
lockfile = true
lockfile_platforms = ["linux-x64", "linux-arm64", "macos-arm64", "windows-x64"]

[tools]
bats = "1.14.0"
"github:Goldziher/poly" = "0.31.2"
"github:Goldziher/ai-rulez" = "5.9.3"

[tasks.setup]
description = "Install the mise toolchain and development hooks"
run = ["mise install", { task = "governance:hooks:install" }]

[task_config]
includes = ["mise-tasks", "mise-tasks/shared.toml"]

[env]
BATS_LIB_REF = "v1.29.0"

[tasks."test:bats"]
description = "Run offline shell contract tests"
env = { BATS_LIB_PATH = "{{config_root}}/tests/lib" }
run = "bats --print-output-on-failure tests/bats"

[tasks."test:lib:sync"]
description = "Refresh the pinned shared Bats helpers"
run = "bash scripts/sync-bats-lib.sh sync"

[tasks."test:lib:check"]
description = "Verify pinned shared Bats helper bytes"
run = "bash scripts/sync-bats-lib.sh --check"
