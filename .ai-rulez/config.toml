# Documentation: https://github.com/Goldziher/ai-rulez

version = "5.0"
name = 'homebrew-tap'
description = 'Homebrew tap with formulas for xberg-io CLI tools'
gitignore = true
gitignore_exclude = [".ai-rulez/.generated-manifest.json"]
presets = ["claude", "codex", "copilot", "cursor", "antigravity", "opencode", "pi"]
builtins = ["!git-workflow", 'ruby', 'default-commands']

compact = true
[[includes]]
name = 'xberg-core'
source = 'https://github.com/xberg-io/agent-conventions.git'
ref = "adb0caa92c4d8155fb1680618f72a321a832660b"
path = 'modules/core'
merge_strategy = 'local-override'


[mcp]
self_server_command = ["ai-rulez", "mcp"]
[[mcp_servers]]
name = "playwright"
command = "npx"
args = ["-y", "@playwright/mcp@0.0.83"]

[lock]
include_outputs = false
